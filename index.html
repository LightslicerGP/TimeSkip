<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeSkip</title>

    <link rel="shortcut icon" type="image/png" href="Icons/PWATemplate.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="transparent" />
    <meta name="description" content="An app to keep track of your solve times." />
    <link rel="stylesheet" href="index.css" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>

    <nav class="removed">
        <div id="small">
            <div class="tab-bar glassy">
                <div class="tab-item" id="selected">
                    <svg xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 8l0 4l2 2" />
                        <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" />
                    </svg>
                    <p>Times</p>
                </div>
                <div class="tab-item">
                    <svg id="viewLeaderboard" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"
                        viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6" />
                        <path d="M9 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10" />
                        <path d="M15 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14" />
                        <path d="M4 20h14" />
                    </svg>
                    <p>Leaderboard</p>
                </div>
                <div class="tab-item">
                    <svg xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 19l16 0" />
                        <path d="M4 15l4 -6l4 2l4 -5l4 4" />
                    </svg>
                    <p>Graph</p>
                </div>
            </div>
            <div class="action-btn glassy" id="backBtn">
                <svg xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 6l-6 6l6 6" />
                </svg>
            </div>
        </div>
        <div id="medium">
            <div class="tab-bar glassy sc-m">
                <div class="tab-item" id="selected">
                    <p>Times</p>
                </div>
                <div class="tab-item">
                    <p>Leaderboard</p>
                </div>
                <div class="tab-item">
                    <p>Graph</p>
                </div>
                <svg id="backBtn" class="action-btn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"
                    viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 6l-6 6l6 6" />
                </svg>
            </div>
        </div>
    </nav>
    <section id="timer">
        <nav>
            <div id="TL" class="glassy button">
                <svg xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" />
                    <path
                        d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" />
                    <path d="M3 3l18 18" />
                </svg>
                <svg id="fullscreenBtn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 8v-2a2 2 0 0 1 2 -2h2" />
                    <path d="M4 16v2a2 2 0 0 0 2 2h2" />
                    <path d="M16 4h2a2 2 0 0 1 2 2v2" />
                    <path d="M16 20h2a2 2 0 0 0 2 -2v-2" />
                </svg>
                <svg id="install-btn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                    <path d="M7 11l5 5l5 -5" />
                    <path d="M12 4l0 12" />
                </svg>
            </div>
            <div id="TR" class="glassy button">
                <svg id="settingsBtn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
                    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                </svg>
                <svg id="timesBtn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 6l16 0" />
                    <path d="M4 12l16 0" />
                    <path d="M4 18l16 0" />
                </svg>
            </div>
        </nav>
        <div id="time">Ready</div>
        <div id="scramble">B2 D2 B2 D R2 U' F2 D' U' B' D2 B2 U2 R2 D F D' F2 R</div>
        <div id="statsBL"></div>
        <div id="statsBR"></div>
    </section>
    <section id="times" class="removed">
        <nav>
            <div id="TL" class="glassy button">
                <svg id="exportTimes" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
                    <path d="M12 17v-6" />
                    <path d="M9.5 14.5l2.5 2.5l2.5 -2.5" />
                </svg>
                <svg id="importTimes" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
                    <path d="M12 11v6" />
                    <path d="M9.5 13.5l2.5 -2.5l2.5 2.5" />
                </svg>
            </div>
            <div id="TR" class="glassy button">
                <svg id="switchSortOrder" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 6h16" />
                    <path d="M6 12h12" />
                    <path d="M9 18h6" />
                </svg>
            </div>
        </nav>
        <header>
            <h1>Times</h1>
        </header>
        <div class="card">
            <!-- <div class="timelistItem">
                <p class="timelistTime">21.383</p>
                <p class="timelistDate">11.5.26 12:43pm</p>
                <p class="timelistNumber">802nd</p>
                <p class="timelistModification">DNF</p>
                <svg class="timelistOptions" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24" fill="none"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                    <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                    <path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                </svg>
            </div> -->
        </div>
    </section>
    <section id="leaderboard" class="removed">
        <header>
            <h1>Leaderboard</h1>
        </header>
    </section>
    <section id="graph" class="removed">
        <header>
            <h1>Graph</h1>
        </header>
    </section>
    <section id="settings" class="removed">
        <nav>
            <div id="BR" class="glassy button">
                <svg id="settingsBackBtn" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" viewBox="0 0 24 24"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 6l-6 6l6 6" />
                </svg>
            </div>
        </nav>
        <header>
            <h1>Settings</h1>
        </header>
        <div class="card">
            <label class="switch">
                <span>Show time during solve</span>
                <input id="showTimeDuringSolveSwitch" type="checkbox">
                <span class="switch-track"></span>
            </label>
            <label class="switch">
                <span>Show scramble</span>
                <input id="showScramble" type="checkbox">
                <span class="switch-track"></span>
            </label>
            <label class="slider">
                <span>Scramble length</span>
                <div id="scrambleLength" class="slider-row">
                    <span class="slider-side">12</span>
                    <div class="slider-wrapper">
                        <div class="slider-progress"></div>
                        <div class="slider-ticks"></div>
                        <input type="range" min="12" max="22">
                    </div>
                </div>
            </label>
        </div>
        <div class="card" id="statsConfig">
            <div id="selectSide">
                <p id="selectedSide" data-side="left">Left</p>
                <p data-side="right">Right</p>
            </div>
            <ul id="statsConfigList"></ul>
        </div>
    </section>

    <script type="module" src="index.js"></script>
    <script src="https://hishamc24.github.io/MNMLUI/MNMLUI.js"></script>
    <script src="pwa.js"></script>

</body>

</html>
